<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NOC Dashboard | Login</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">

      <!-- Logo / Branding -->
      <div class="auth-header">
        <div class="auth-logo">🛡️</div>
        <h1>NOC Incident Dashboard</h1>
        <p>CMSO ServiceNow — AP_NOC Team Portal</p>
      </div>

      <!-- Tab Toggle -->
      <div class="auth-tabs">
        <button class="tab-btn active" id="loginTab" onclick="switchTab('login')">Login</button>
        <button class="tab-btn" id="signupTab" onclick="switchTab('signup')">Sign Up</button>
      </div>

      <!-- LOGIN FORM -->
      <form id="loginForm" class="auth-form" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="loginEmail">NOC Agent Email</label>
          <input type="email" id="loginEmail" placeholder="msi@motorolasolutions.com" required />
        </div>
        <div class="form-group">
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" placeholder="••••••••" required />
        </div>
        <div class="form-error" id="loginError"></div>
        <button type="submit" class="btn-primary">Login →</button>
      </form>

      <!-- SIGNUP FORM -->
      <form id="signupForm" class="auth-form hidden" onsubmit="handleSignup(event)">
        <div class="form-group">
          <label for="signupName">Full Name</label>
          <input type="text" id="signupName" placeholder="John Doe" required />
        </div>
        <div class="form-group">
          <label for="signupEmail">NOC Agent Email</label>
          <input type="email" id="signupEmail" placeholder="msi@motorolasolutions.com" required />
        </div>
        <div class="form-group">
          <label for="signupRole">Role</label>
          <select id="signupRole" required>
            <option value="">-- Select Role --</option>
            <option value="NOC_AGENT">NOC Agent</option>
            <option value="NOC_LEAD">NOC Team Lead</option>
            <option value="NOC_CARRIER">NOC Carrier Agent</option>
          </select>
        </div>
        <div class="form-group">
          <label for="signupPassword">Password</label>
          <input type="password" id="signupPassword" placeholder="Min 8 characters" required />
        </div>
        <div class="form-group">
          <label for="signupConfirm">Confirm Password</label>
          <input type="password" id="signupConfirm" placeholder="••••••••" required />
        </div>
        <div class="form-error" id="signupError"></div>
        <button type="submit" class="btn-primary">Create Account →</button>
      </form>

    </div>
  </div>
  <script src="js/auth.js"></script>
</body>
</html>
